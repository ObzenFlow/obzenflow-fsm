[package]
name = "obzenflow-fsm"
description = "Async-first finite state machine (FSM) library"
version.workspace = true
edition = "2021"
authors = ["ObzenFlow Contributors"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/ObzenFlow/obzenflow-fsm"
homepage = "https://github.com/ObzenFlow/obzenflow-fsm"
documentation = "https://docs.rs/obzenflow-fsm"
keywords = ["fsm", "async", "state-machine", "actor", "finite-state-machine"]
categories = ["asynchronous", "data-structures", "algorithms"]
publish = true
include = [
    "/src/**/*.rs",
    "/tests/**",
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/TRADEMARKS.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[lints]
workspace = true

[workspace]
members = ["obzenflow-fsm-macros", "."]

[workspace.package]
version = "0.4.0"

[workspace.lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
let_underscore_untyped = "deny"
let_underscore_must_use = "deny"
no_effect_underscore_binding = "deny"
used_underscore_binding = "deny"

[dependencies]
# Core dependencies only - no dependencies on other ObzenFlow crates
async-trait = "0.1"
tokio = { version = "1.35", features = ["rt", "macros", "time"] }
tracing = "0.1"
thiserror = "2.0"
futures = "0.3"

obzenflow-fsm-macros = { version = "=0.4.0", path = "obzenflow-fsm-macros" }

[dev-dependencies]
tokio = { version = "1.35", features = ["full", "test-util"] }
tracing-subscriber = "0.3"
rand = "0.8.6"
trybuild = "1"
